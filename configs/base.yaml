model: {name: Qwen/Qwen3-4B, enable_thinking: false, attn_impl: sdpa}
seed: 42
paths:
  raw: data/raw
  processed: data/processed
  eval: data/eval
  results: results
  sft_adapter: models/sft_adapter
  dpo_adapter: models/dpo_adapter
labels: {0: negative, 1: neutral, 2: positive}
instruction: "What is the sentiment of this financial text? Answer with one of: negative, neutral, positive."
answer_format: "Sentiment: {label}"
quant: {load_in_4bit: true, quant_type: nf4, double_quant: true, compute_dtype: float16}
sft:
  data: {dedupe_on_input: true, group_split: true, remove_phrasebank_overlap: true, train_size: 10000, val_size: 500, stratified: true, fuzzy_threshold: 95}
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  train: {lr: 2.0e-4, scheduler: cosine, warmup_ratio: 0.03, epochs: 1, per_device_batch: 8, grad_accum: 4, max_seq_length: 256, weight_decay: 0.01, max_grad_norm: 1.0, optim: paged_adamw_32bit, gradient_checkpointing: true, eval_steps: 100, save_best_by: eval_loss, completion_only_loss: true}
dpo:
  data: {dedupe_pairs: true, max_pairs_per_prompt: 2, max_prompt_length: 256, max_length: 768}
  lora: {r: 16, alpha: 32, dropout: 0.05}
  train: {beta: 0.1, lr: 5.0e-6, scheduler: cosine, warmup_ratio: 0.1, per_device_batch: 1, grad_accum: 16, max_steps: 200, gradient_checkpointing: true}
  stop_rule: "stop and flag if validation macro-F1 drops more than 1 point below M1"
eval:
  generation: {do_sample: false, max_new_tokens: 12, batch_size: 32}
  few_shot_k: 5
  bootstrap_samples: 1000
  paraphrase_prompts: 3
  label_scoring_mode: true
ablations: {rank: [8, 16, 64], targets: [attention_only, all_7], train_size: [3000, 10000, 20000], lr: [1.0e-4, 2.0e-4]}
